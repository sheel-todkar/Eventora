services:
  app:
    build: .
    container_name: eventora-api
    env_file: ./server/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - eventora-net

  redis:
    image: redis:7-alpine
    container_name: eventora-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - eventora-net

  nginx:
    image: nginx:alpine
    container_name: eventora-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - eventora-net

volumes:
  redis_data:

networks:
  eventora-net:
    driver: bridge
